name: Docker branch build

# Builds the feature branch image for arm64 (A1 VM) and pushes it to GHCR so
# the server can pull it instead of compiling locally. amd64 (the old E2 micro
# VM) is opt-in on manual runs. Triggered on pushes to the MCP categorization
# branch, or manually.
on:
  push:
    branches: [feature/mcp-commit-category-assignments]
  workflow_dispatch:
    inputs:
      amd64:
        description: Also build amd64 (old E2 VM)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.amd64 && '["amd64","arm64"]' || '["arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-branch:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-branch-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-branch-${{ matrix.arch }}

      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-branch:ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image under a staging tag
        env:
          STAGING:
            ghcr.io/${{ github.repository_owner }}/wealthfolio:ci-${{ github.run_id }}-${{
            matrix.arch }}
        run: |
          docker tag wealthfolio-branch:ci "$STAGING"
          docker push "$STAGING"

  publish:
    # Branch tags move only after every built architecture has passed its tests.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=raw,value=mcp-categorization
            type=sha,prefix=mcp-

      - name: Publish branch tags
        env:
          STAGING: ghcr.io/${{ github.repository_owner }}/wealthfolio:ci-${{ github.run_id }}
          ARCHES: ${{ inputs.amd64 && 'amd64 arm64' || 'arm64' }}
        run: |
          sources=()
          for arch in $ARCHES; do sources+=("$STAGING-$arch"); done
          while IFS= read -r tag; do
            test -n "$tag"
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< "${{ steps.meta.outputs.tags }}"
