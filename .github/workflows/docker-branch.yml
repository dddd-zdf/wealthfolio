name: Docker branch build

# Builds the feature branch image and pushes it to GHCR so the Oracle VM can
# pull it instead of compiling locally. Triggered on pushes to the MCP
# categorization branch, or manually.
on:
  push:
    branches: [feature/mcp-commit-category-assignments]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=raw,value=mcp-categorization
            type=sha,prefix=mcp-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wealthfolio-branch:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-branch
          cache-to: type=gha,mode=max,scope=docker-branch

      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-branch:ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push branch tags
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            docker tag wealthfolio-branch:ci "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
