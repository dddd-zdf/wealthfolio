name: Docker branch build

# Builds the feature branch image for amd64 (E2 micro VM) and arm64 (A1 VM) and
# pushes it to GHCR so the Oracle VMs can pull it instead of compiling locally.
# Triggered on pushes to the MCP categorization branch, or manually.
on:
  push:
    branches: [feature/mcp-commit-category-assignments]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-branch:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-branch-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-branch-${{ matrix.arch }}

      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-branch:ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image under a staging tag
        env:
          STAGING:
            ghcr.io/${{ github.repository_owner }}/wealthfolio:ci-${{ github.run_id }}-${{
            matrix.arch }}
        run: |
          docker tag wealthfolio-branch:ci "$STAGING"
          docker push "$STAGING"

  publish:
    # Branch tags move only after both architectures have passed their tests.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=raw,value=mcp-categorization
            type=sha,prefix=mcp-

      - name: Publish multi-arch branch tags
        env:
          STAGING: ghcr.io/${{ github.repository_owner }}/wealthfolio:ci-${{ github.run_id }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            docker buildx imagetools create --tag "$tag" "$STAGING-amd64" "$STAGING-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
