name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
      - codex/upstream-3.11

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      formatting: ${{ steps.filter.outputs.formatting }}
      addon_sandbox: ${{ steps.filter.outputs.addon_sandbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python3 .github/scripts/ci_changes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  translation-parity:
    name: Translation parity
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test translation checker
        run: node --test apps/frontend/scripts/check-translations.test.mjs
      - name: Check every language and namespace
        run: node apps/frontend/scripts/check-translations.mjs

  design-ratchet:
    name: Design ratchet
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check that no file gains design-system debt
        run: node scripts/design-ratchet.mjs

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          # No `cache: pnpm`: restore plus warm install is no faster than a cold
          # install, and each PR would save its own ~120 MB copy.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  frontend-check:
    name: Frontend Check
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          # No `cache: pnpm`: restore plus warm install is no faster than a cold
          # install, and each PR would save its own ~120 MB copy.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package types
        run: pnpm run build:types

      - name: Lint
        run: pnpm lint

      - name: Type check packages
        # Declarations are already built above; the frontend build runs its type check.
        run: pnpm --filter './packages/*' -r type-check

      - name: Run web script tests
        # The frontend unit tests run in the Frontend Tests job. Keep native/Tauri
        # wrapper tests out of the web-only deployment gate.
        run:
          node --test scripts/design-ratchet-direction.test.mjs
          apps/frontend/scripts/theme-generate.test.mjs

      - name: Check the generated theme CSS
        # Fails when src/themes/generated is stale against the definitions, or a
        # definition breaks the generator's rules (unknown tokens, font stacks
        # without "Rubik Arabic", component rules). Contrast is checked by the
        # on-demand design-system suite, not here.
        run: pnpm themes:check

      - name: Build frontend
        run: pnpm build

      - name: Install addon sandbox browsers
        if: needs.changes.outputs.addon_sandbox == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run addon sandbox browser tests
        if: needs.changes.outputs.addon_sandbox == 'true'
        run: pnpm test:e2e:addon-sandbox
        env:
          WF_ADDON_SANDBOX_SKIP_BUILD: "true"

  frontend-tests:
    name: Frontend Tests (shard ${{ matrix.shard }})
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package types
        run: pnpm run build:types

      - name: Run Vitest shard
        run: >-
          pnpm --filter frontend exec vitest run --shard=${{ matrix.shard }}/2 --exclude
          'src/adapters/tauri/**' --exclude '**/native-*.test.*' --exclude
          'src/adapters/adapter-command-parity.test.ts'

  rust-clippy:
    name: Rust Clippy
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        # Installs the pinned toolchain and components from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # cache-warm.yml seeds this key on main. A PR's own copy (~2 GB) is
          # readable only by that PR and evicts the shared caches, so PRs
          # restore without saving. The key follows rust-toolchain.toml rather
          # than every installed toolchain, so runner image updates to stable
          # Rust do not invalidate it.
          prefix-key: v1-rust-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: pr-server-check
          add-rust-environment-hash-key: false
          save-if: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run:
          cargo clippy --locked --workspace --exclude wealthfolio-app --all-targets --all-features
          -- -D warnings

  rust-tests:
    name: Rust Tests
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
      # Required for outbox tests in storage-sqlite
      CONNECT_API_URL: http://test.local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        # Installs the pinned toolchain and components from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Keep in sync with Rust Clippy above and cache-warm.yml.
          prefix-key: v1-rust-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: pr-server-check
          add-rust-environment-hash-key: false
          save-if: false

      - name: Test
        # nextest runs every test binary in parallel. The AI fixture feature is
        # enabled here so its tests share this build instead of compiling again.
        run:
          cargo nextest run --locked --workspace --exclude wealthfolio-app --features
          wealthfolio-ai/test-utils --no-fail-fast

      - name: Doc tests
        # nextest does not run doc tests.
        run:
          cargo test --locked --workspace --exclude wealthfolio-app --features
          wealthfolio-ai/test-utils --doc

      - name: Test administrator-owned vault and individual file mount
        # Normal vault/config/portable-backup tests already run in the workspace
        # suite. This Linux deployment fixture needs an actual root-owned mount.
        # Same flags as Test, so it reuses that build.
        shell: bash
        run: |
          fixture_dir=$(mktemp -d)
          trap 'sudo umount "$fixture_dir/mounted" 2>/dev/null || true; rm -rf "$fixture_dir"' EXIT
          sudo install -m 0660 -o root -g "$(id -g)" /dev/null "$fixture_dir/source"
          touch "$fixture_dir/mounted"
          sudo mount --bind "$fixture_dir/source" "$fixture_dir/mounted"
          for fixture in "$fixture_dir/source" "$fixture_dir/mounted"; do
            WF_VAULT_DEPLOYMENT_FIXTURE="$fixture" cargo nextest run --locked --workspace \
              --exclude wealthfolio-app --features wealthfolio-ai/test-utils \
              -E 'package(wealthfolio-server) & test(=secrets::tests::deployment_file_fixture)'
          done

  build-status:
    name: Build Status
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        formatting,
        translation-parity,
        design-ratchet,
        frontend-check,
        frontend-tests,
        rust-clippy,
        rust-tests,
      ]
    if: always()

    steps:
      - name: Check build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMATTING_REQUIRED: ${{ needs.changes.outputs.formatting }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          TRANSLATION_RESULT: ${{ needs.translation-parity.result }}
          DESIGN_RATCHET_RESULT: ${{ needs.design-ratchet.result }}
          FRONTEND_RESULT: ${{ needs.frontend-check.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$FRONTEND_RESULT" = success
            test "$FRONTEND_TESTS_RESULT" = success
            test "$TRANSLATION_RESULT" = success
            test "$DESIGN_RATCHET_RESULT" = success
          fi
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_CLIPPY_RESULT" = success
            test "$RUST_TESTS_RESULT" = success
          fi
          if [ "$FORMATTING_REQUIRED" = true ]; then
            test "$FORMATTING_RESULT" = success
          fi
          echo "All required checks passed."
