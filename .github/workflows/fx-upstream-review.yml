name: Historical FX upstream review

on:
  push:
    branches: [ci/fx-upstream-review-20261101]
    paths: [.github/workflows/fx-upstream-review.yml]

permissions:
  contents: read

concurrency:
  group: historical-fx-upstream-review
  cancel-in-progress: true

jobs:
  rust:
    name: Rust - ${{ matrix.change }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - change: historical FX
            ref: fix/historical-fx-as-of
            packages: -p wealthfolio-core -p wealthfolio-portfolio-engine
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C debuginfo=0
      CONNECT_API_URL: http://test.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Record tested revision
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: pr-server-check
          add-rust-environment-hash-key: false
          save-if: false
      - name: Rust formatting
        run: cargo fmt ${{ matrix.packages }} -- --check
      - name: Clippy for affected crates
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets --all-features -- -D warnings
      - name: Generate updated golden expectations for review
        env:
          INSTA_UPDATE: always
        run: |
          cargo test --locked -p wealthfolio-portfolio-engine --test goldens
          git diff --binary -- crates/portfolio-engine/tests/fixtures/goldens > "$RUNNER_TEMP/fx-goldens.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: fx-upstream-golden-review
          path: ${{ runner.temp }}/fx-goldens.patch
      - name: Recheck the two failed golden consumers
        run: >-
          cargo nextest run --locked ${{ matrix.packages }}
          -E 'test(kernel_goldens) | test(every_parity_scenario_persists_the_kernel_golden)'
          --no-fail-fast
