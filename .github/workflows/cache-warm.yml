name: Warm Rust Cache

# Dependency artifacts (the only thing rust-cache keeps - workspace crates are
# pruned) only change when Cargo.lock, a manifest's features, or the toolchain
# changes, hence the narrow path filter. The weekly run keeps caches alive
# (GitHub evicts caches unused for 7 days). The toolchain is pinned in
# rust-toolchain.toml, which is part of the cache key.
#
# warm-pr-check seeds the cache that pr-check.yml's Rust jobs restore; PR
# runs restore it without saving.
#
# warm-docker-deps exports the Dockerfile's dependency layers to the
# wealthfolio-build-cache GHCR package, outside the Actions cache budget.
# docker-publish.yml imports it without logging in, except on release tags, so
# the package must stay public, or Docker builds compile every dependency.
# Docker dependency warming is manual on main so packaging-only changes do not
# rebuild the Rust cache job.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain*"
      - ".cargo/config.toml"
      - ".github/workflows/cache-warm.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  warm-pr-check:
    # Keep runs-on, env, toolchain setup, cache inputs and cargo builds in sync
    # with the rust-clippy and rust-tests jobs in pr-check.yml; any drift makes
    # PRs build cold.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        # Installs the pinned toolchain and components from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust cache
        id: rust-cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-${{ hashFiles('rust-toolchain.toml') }}
          shared-key:
            pr-server-check-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          add-rust-environment-hash-key: false
          save-if: github.ref == 'refs/heads/main'

      - name: Build PR check dependencies
        # The Rust Clippy and Rust Tests builds, without running tests. The
        # desktop app is excluded because this fork ships the server/web build
        # only.
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --locked --workspace --exclude wealthfolio-app --all-targets --all-features
          CONNECT_API_URL=http://test.local cargo test --locked --workspace --exclude wealthfolio-app --features wealthfolio-ai/test-utils --no-run

  warm-docker-deps:
    # Unlike Actions caches, these registry tags are shared by every ref. Keep
    # this dependency-only warm-up explicit and main-only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Keep the cache refs, platforms and runners in sync with docker-publish.yml,
    # which imports these layers; any drift makes Docker builds cold.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Docker dependency layers
        # Builds only the deps stage: no Connect build args or secrets reach it.
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: deps
          outputs: type=cacheonly
          # Reuse main's full graph when available, then the dependency-only
          # cache this job refreshes.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/wealthfolio-build-cache:branch-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/wealthfolio-build-cache:deps-${{ matrix.arch }}
          cache-to:
            type=registry,ref=ghcr.io/${{ github.repository_owner
            }}/wealthfolio-build-cache:deps-${{ matrix.arch
            }},mode=max,image-manifest=true,oci-mediatypes=true
