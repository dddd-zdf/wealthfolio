name: Web currency consistency upstream review

on:
  push:
    branches: [ci/fx-upstream-review-20261101]
    paths: [.github/workflows/web-currency-review.yml]

permissions:
  contents: read

concurrency:
  group: web-currency-upstream-review
  cancel-in-progress: true

jobs:
  server:
    name: Rust formatting (server logic validated in run 42116279672)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C debuginfo=0
      CONNECT_API_URL: http://test.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47f8ef7c09c7b96d310ec6a7d9e025e5ad7c048d
      - name: Record tested revision
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Rust formatting
        id: rust_format
        run: cargo fmt -p wealthfolio-server -p wealthfolio-core -- --check
      - name: Export formatting patch
        if: steps.rust_format.outcome == 'failure'
        run: |
          cargo fmt -p wealthfolio-server -p wealthfolio-core
          git diff > currency-format.patch
      - uses: actions/upload-artifact@v4
        if: steps.rust_format.outcome == 'failure'
        with:
          name: currency-format
          path: currency-format.patch

  web:
    name: Web cache regressions, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_TARGET: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47f8ef7c09c7b96d310ec6a7d9e025e5ad7c048d
      - name: Record tested revision
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Changed frontend formatting
        run: >-
          pnpm exec oxfmt --check
          apps/frontend/src/hooks/use-settings.ts
          apps/frontend/src/hooks/use-settings-mutation.ts
          apps/frontend/src/hooks/use-settings-mutation.test.tsx
          apps/frontend/src/lib/currency-cache.ts
          apps/frontend/src/lib/currency-cache.test.ts
          apps/frontend/src/lib/settings-provider.tsx
          apps/frontend/src/use-global-event-listener.ts
      - name: Frontend lint
        run: pnpm --filter frontend lint:quiet
      - name: Type checks
        run: pnpm type-check
      - name: Focused web regressions
        run: >-
          pnpm --filter frontend exec vitest run
          src/lib/currency-cache.test.ts
          src/hooks/use-settings-mutation.test.tsx
          src/adapters/web/events.test.ts
          src/adapters/web/settings.test.ts
      - name: Adapter command parity (default target)
        env:
          BUILD_TARGET: tauri
        run: pnpm --filter frontend exec vitest run src/adapters/adapter-command-parity.test.ts
      - name: Web production build
        run: pnpm build
