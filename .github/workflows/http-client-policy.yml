name: HTTP client policy

on:
  # Linux certificate-policy tests already run in the PR workspace suite.
  workflow_dispatch:
    inputs:
      cross_platform:
        description: Also test macOS and Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tls:
    name: TLS verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          ${{ fromJSON(inputs.cross_platform && '["ubuntu-latest","macos-latest","windows-latest"]'
          || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore only: a PR's copy is readable only by that PR and competes
          # with the shared caches cache-warm.yml seeds on main.
          save-if: false
      - name: Test certificate policy and HTTP behavior
        run: cargo test --locked -p wealthfolio-http
