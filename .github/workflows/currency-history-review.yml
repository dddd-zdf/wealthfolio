name: Currency history snapshot review

on:
  push:
    branches: [codex/web-currency-history]

permissions:
  contents: read

jobs:
  review-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: pr-server-check
          add-rust-environment-hash-key: false
          save-if: false
      - name: Generate historical FX snapshots for review
        env:
          INSTA_UPDATE: always
        run: cargo test --locked -p wealthfolio-portfolio-engine --test goldens
      - name: Export review patch
        run:
          git diff -- crates/portfolio-engine/tests/fixtures/goldens/kernel >
          currency-history-snapshots.patch
      - uses: actions/upload-artifact@v4
        with:
          name: currency-history-snapshots
          path: currency-history-snapshots.patch
      - name: Engine currency, scope and window regressions
        run: cargo test --locked -p wealthfolio-portfolio-engine
